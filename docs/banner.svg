<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C1B" />
      <stop offset="50%" stop-color="#15102A" />
      <stop offset="100%" stop-color="#06040A" />
    </linearGradient>

    <!-- Tonal Primary Glow Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A255FF" />
      <stop offset="50%" stop-color="#E8DEF8" />
      <stop offset="100%" stop-color="#6750A4" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 6px;
      fill: url(#glow-grad);
      animation: shift-grad 6s ease infinite alternate;
    }
    
    .subtitle-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 4px;
      fill: #A29EBA;
      opacity: 0.85;
      animation: pulse-opacity 3s ease infinite alternate;
    }

    .pulse-node {
      animation: pulse-node-scale 2.5s ease-in-out infinite alternate;
    }

    .flow-line {
      stroke: #6750A4;
      stroke-width: 1.5;
      stroke-dasharray: 8 16;
      animation: flow-dash 12s linear infinite;
    }

    .grid-lines {
      stroke: rgba(103, 80, 164, 0.08);
      stroke-width: 1;
    }

    @keyframes shift-grad {
      0% { stop-color: #A255FF; }
      100% { stop-color: #6750A4; }
    }

    @keyframes pulse-opacity {
      0% { opacity: 0.6; }
      100% { opacity: 0.95; }
    }

    @keyframes pulse-node-scale {
      0% { r: 6; opacity: 0.5; filter: drop-shadow(0 0 2px #A255FF); }
      100% { r: 9; opacity: 0.9; filter: drop-shadow(0 0 8px #6750A4); }
    }

    @keyframes flow-dash {
      to {
        stroke-dashoffset: -120;
      }
    }
  </style>

  <!-- Background Rect -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="24" />

  <!-- Background Tech Grid -->
  <g class="grid-lines">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="400" y1="0" x2="400" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
  </g>

  <!-- Animated Supply Chain Lanes -->
  <path d="M 80,125 Q 240,60 400,125 T 720,125" fill="none" class="flow-line" />
  <path d="M 80,125 Q 240,190 400,125 T 720,125" fill="none" class="flow-line" style="animation-delay: -6s; stroke: #A255FF;" />

  <!-- Central Header Text -->
  <g transform="translate(400, 115)" text-anchor="middle">
    <text y="0" class="title-text" filter="url(#glow)">DEMANDFLOW AI</text>
    <text y="42" class="subtitle-text">AUTONOMOUS FORECASTING &amp; INVENTORY ENGINE</text>
  </g>

  <!-- Glowing Animated Nodes -->
  <circle cx="80" cy="125" r="7" fill="#6750A4" class="pulse-node" style="animation-delay: 0s;" />
  <circle cx="240" cy="80" r="7" fill="#A255FF" class="pulse-node" style="animation-delay: 0.5s;" />
  <circle cx="400" cy="125" r="8" fill="#E8DEF8" class="pulse-node" style="animation-delay: 1s;" />
  <circle cx="560" cy="170" r="7" fill="#A255FF" class="pulse-node" style="animation-delay: 1.5s;" />
  <circle cx="720" cy="125" r="7" fill="#6750A4" class="pulse-node" style="animation-delay: 2s;" />
</svg>
